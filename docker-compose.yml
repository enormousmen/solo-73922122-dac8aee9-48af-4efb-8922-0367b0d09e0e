services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orders_demo
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orders_demo"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: orders_demo
      BACKUP_DIR: /srv/app/backups
    ports:
      - "8000:8000"
    volumes:
      # 通过演练核对的 orders 备份会落到宿主机 ./backups，也可直接取文件
      - ./backups:/srv/app/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
